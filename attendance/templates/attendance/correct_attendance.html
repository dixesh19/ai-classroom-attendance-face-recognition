{% extends "attendance/base.html" %}
{% block title %}Correct Attendance{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card shadow-sm">
<div class="card-body">
<h3>Correct Attendance</h3>
<p><strong>{{ record.student.name }}</strong> — {{ record.student.register_number }}</p>
<p>Date: {{ record.date }}</p>
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<button class="btn btn-primary">Save</button>
<a class="btn btn-secondary" href="{% url 'dashboard' %}">Cancel</a>
</form>
</div>
</div>
</div>
</div>
{% endblock %}
