<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Attendance{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/attendance/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">AI Attendance</a>
        {% if user.is_authenticated %}
        <div>
            <a class="btn btn-outline-light btn-sm me-1" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="btn btn-outline-light btn-sm me-1" href="{% url 'students' %}">Students</a>
            <a class="btn btn-outline-light btn-sm me-1" href="{% url 'take_attendance' %}">Take Attendance</a>
            <a class="btn btn-warning btn-sm" href="{% url 'logout' %}">Logout</a>
        </div>
        {% endif %}
    </div>
</nav>

<main class="container py-4">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
