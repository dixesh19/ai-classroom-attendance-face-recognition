{% extends "attendance/base.html" %}
{% block title %}Take Attendance{% endblock %}
{% block content %}
<h1>Take Attendance</h1>
<p class="text-muted">Upload a classroom image or capture a webcam frame.</p>

<div class="row g-4">
<div class="col-lg-6">
<div class="card shadow-sm">
<div class="card-body">
<h4>Upload Classroom Photo</h4>
<form method="post" action="{% url 'process_attendance' %}" enctype="multipart/form-data">
{% csrf_token %}
<input class="form-control mb-3" type="file" name="classroom_image" accept="image/*" required>
<button class="btn btn-primary">Process Photo</button>
</form>
</div>
</div>
</div>

<div class="col-lg-6">
<div class="card shadow-sm">
<div class="card-body">
<h4>Webcam</h4>
<video id="video" class="camera-preview" autoplay playsinline></video>
<canvas id="canvas" class="d-none"></canvas>
<div class="mt-3">
<button id="start" class="btn btn-dark">Start Camera</button>
<button id="capture" class="btn btn-success">Capture & Process</button>
</div>
<form id="camera-form" method="post" action="{% url 'process_attendance' %}" enctype="multipart/form-data">
{% csrf_token %}
<input id="camera-file" type="file" name="classroom_image" class="d-none">
</form>
</div>
</div>
</div>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const start = document.getElementById("start");
const capture = document.getElementById("capture");
const form = document.getElementById("camera-form");
const fileInput = document.getElementById("camera-file");

let stream = null;

start.addEventListener("click", async () => {
    try {
        stream = await navigator.mediaDevices.getUserMedia({video: true, audio: false});
        video.srcObject = stream;
    } catch (error) {
        alert("Camera access failed: " + error.message);
    }
});

capture.addEventListener("click", () => {
    if (!stream) {
        alert("Start the camera first.");
        return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);

    canvas.toBlob(blob => {
        const file = new File([blob], "webcam.jpg", {type: "image/jpeg"});
        const transfer = new DataTransfer();
        transfer.items.add(file);
        fileInput.files = transfer.files;
        if (stream) stream.getTracks().forEach(track => track.stop());
        form.submit();
    }, "image/jpeg", 0.9);
});
</script>
{% endblock %}
